<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for reusable elements -->
  <defs>
    <style>
      text { font-family: monospace; font-size: 12px; fill: black; }
      rect.data { fill: #4CAF50; }
      rect.zeros { fill: #B0BEC5; }
      rect.uninit { fill: #FFCDD2; }
      .label { font-size: 10px; text-anchor: middle; }
      .address { font-size: 10px; text-anchor: middle; fill: #333; }
    </style>
  </defs>

  <!-- First diagram: Kernel image layout -->
  <g transform="translate(10, 10)">
    <text x="0" y="0">Kernel image layout (issue1979.img):</text>
    <rect x="0" y="20" width="50" height="20" class="data"/>
    <text x="25" y="32" class="label">data</text>
    <rect x="50" y="20" width="450" height="20" class="zeros"/>
    <text x="275" y="32" class="label">zeros</text>
    <text x="0" y="50" class="address">0x000000</text>
    <text x="50" y="50" class="address">0x000228</text>
    <text x="500" y="50" class="address">0x090000</text>
  </g>

  <!-- Second diagram: Firmware-loaded layout -->
  <g transform="translate(10, 80)">
    <text x="0" y="0">Firmware-loaded layout:</text>
    <!-- At 0x0 -->
    <rect x="50" y="20" width="50" height="20" class="data"/>
    <text x="75" y="32" class="label">data</text>
    <rect x="100" y="20" width="400" height="20" class="zeros"/>
    <text x="300" y="32" class="label">zeros</text>
    <rect x="500" y="20" width="50" height="20" class="uninit"/>
    <text x="525" y="32" class="label">uninit</text>
    <!-- At 0x80000 -->
    <rect x="50" y="50" width="50" height="20" class="data"/>
    <text x="75" y="62" class="label">data</text>
    <rect x="100" y="50" width="400" height="20" class="zeros"/>
    <text x="300" y="62" class="label">zeros</text>
    <rect x="500" y="50" width="50" height="20" class="uninit"/>
    <text x="525" y="62" class="label">uninit</text>
    <text x="0" y="80" class="address">0x0</text>
    <text x="50" y="80" class="address">0x000228</text>
    <text x="500" y="80" class="address">0x080000</text>
    <text x="0" y="110" class="address">0x80000</text>
    <text x="50" y="110" class="address">0x80228</text>
    <text x="500" y="110" class="address">0x110000</text>
  </g>

  <!-- Third diagram: Resulting memory map -->
  <g transform="translate(10, 160)">
    <text x="0" y="0">Resulting memory map:</text>
    <rect x="0" y="20" width="50" height="20" class="data"/>
    <text x="25" y="32" class="label">data</text>
    <rect x="50" y="20" width="400" height="20" class="zeros"/>
    <text x="250" y="32" class="label">zeros</text>
    <rect x="450" y="20" width="50" height="20" class="data"/>
    <text x="475" y="32" class="label">data</text>
    <rect x="500" y="20" width="50" height="20" class="zeros"/>
    <text x="525" y="32" class="label">zeros</text>
    <rect x="550" y="20" width="50" height="20" class="uninit"/>
    <text x="575" y="32" class="label">uninit</text>
    <text x="0" y="50" class="address">0x000000</text>
    <text x="50" y="50" class="address">0x000228</text>
    <text x="450" y="50" class="address">0x080000</text>
    <text x="500" y="50" class="address">0x080228</text>
    <text x="550" y="50" class="address">0x110000</text>
  </g>
</svg>
